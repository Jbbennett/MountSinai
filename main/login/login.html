<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="/main/style.css">
  <link rel="icon" href="/main/images/mount-sinai-low-resolution-logo-black-on-transparent-background.png" type="image/png">
  <title>Login</title>
</head>
<body>

  <header>
    <div class="logo">
      <img src="/main/images/mount-sinai-low-resolution-logo-black-on-transparent-background.png" alt="Logo" class="logo-image">
    </div>
    <nav class="navigation">
      <a href="../main/main.html">Home</a>
      <a href="../register/register.html">Verse of the Day</a>
      <a href="#">Shop</a>
      <a href="#">Contact</a>
      <a href="#">About</a>
    </nav>
    <div class="hamburger" onclick="toggleMenu(this)">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <div class="wrapper">
    <span class="icon-close"><ion-icon name="close"></ion-icon></span>
    <div class="form-box login">
      <div id="loginMessage" class="register-message"></div>
      <h2>Login</h2>
      <form id="loginForm">
        <div class="input-box">
          <span id="icon"><ion-icon name="mail"></ion-icon></span>
          <input type="email" id="loginEmail" required>
          <label for="loginEmail">Email</label>
        </div>
        <div class="input-box">
          <span id="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" id="loginPassword" required>
          <label for="loginPassword">Password</label>
        </div>
        <div class="remember-forgot">
          <label>
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="divider">or</div>
        <button type="button" id="googleLogin" class="btn google-btn" type="button">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="google-icon">
          <span>Sign in with Google</span>
        </button>
        <div id="usernamePrompt">
          <input type="text" id="usernameInput" placeholder="Enter your username" class="input-box">
          <button type="button" id="usernameSubmit" class="btn">Submit</button>
        </div>
        <div class="login-register">
          <p>Don't have an account? 
            <a href="../register/register.html" class="register-link">Register</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="login.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
