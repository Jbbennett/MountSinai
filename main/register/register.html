<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="register.css">
  <link rel="stylesheet" href="/main/style.css">
  <link rel="icon" href="/main/images/mount-sinai-low-resolution-logo-black-on-transparent-background.png" type="image/png">
  <title>Register</title>
</head>
<body>

  <header>
    <div class="logo">
      <img src="/main/images/mount-sinai-low-resolution-logo-black-on-transparent-background.png" alt="Logo" class="logo-image">
    </div>
    <nav class="navigation">
      <a href="../main.html">Home</a>
      <a href="../register/register.html">Verse of the Day</a>
      <a href="#">Shop</a>
      <a href="#">Contact</a>
      <a href="#">About</a>
      <button class="btnLogin-popup">Login</button>
    </nav>
    <div class="hamburger" onclick="toggleMenu(this)">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <div class="wrapper">
    <span class="icon-close"><ion-icon name="close"></ion-icon></span>
    <div class="form-box register">
      <div id="registerMessage" class="register-message"></div>
      <h2>Registration</h2>
      <form id="registerForm">
        
        <div class="input-box">
          <span id="icon"><ion-icon name="person"></ion-icon></span>
          <input type="text" id="username" required>
          <label for="username">Username</label>
        </div>

        <div class="input-box">
          <span id="icon"><ion-icon name="mail"></ion-icon></span>
          <input type="email" id="email" required>
          <label for="email">Email</label>
        </div>

        <div class="input-box">
          <span id="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" id="password" required>
          <label for="password">Password</label>
        </div>

        <div class="remember-forgot">
          <label>
            <input type="checkbox" id="terms" required>
            I agree to the terms & conditions
          </label>
        </div>

        <button type="submit" class="btn">Register</button>

        <div class="login-register">
          <p>Already have an account?
            <a href="../login/login.html" class="login-link">Login</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="register.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
